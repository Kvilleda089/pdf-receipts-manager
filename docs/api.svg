<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Diagrama de API - PDF Receipts Manager</title>
<desc>Endpoints REST: POST /documents, GET /documents/{documentNumber} y GET /health, con esquemas y códigos de respuesta.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1000" height="800" fill="#ffffff"/>
<text x="30" y="38" font-size="20" font-weight="700" fill="#2C2C2A" text-anchor="start" >API · PDF Receipts Manager</text>
<text x="30" y="58" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" >REST · JSON · autenticación por header X-API-KEY (excepto /health) · documentación interactiva en /docs</text>
<rect x="30" y="80" width="600" height="262" rx="8" fill="#FFFFFF" stroke="#639922" stroke-width="1.2"/>
<rect x="46" y="94" width="58" height="24" rx="5" fill="#639922" stroke="#639922" stroke-width="1.2"/>
<text x="75" y="111" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >POST</text>
<text x="122" y="111" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start" >/documents</text>
<text x="600" y="111" font-size="11.5" font-weight="600" fill="#27500A" text-anchor="end" >requiere X-API-KEY</text>
<text x="46" y="138" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" >Convierte el HTML en PDF, lo sube a S3 y registra el documento.</text>
<text x="46" y="162" font-size="11" font-weight="700" fill="#5F5E5A" text-anchor="start" letter-spacing="1">Headers</text>
<text x="46" y="180" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start" font-family="Consolas,Menlo,monospace">X-API-KEY: rk_…     Content-Type: application/json</text>
<text x="46" y="206" font-size="11" font-weight="700" fill="#5F5E5A" text-anchor="start" letter-spacing="1">Body</text>
<text x="46" y="224" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start" >DocumentRequest  (ver esquema a la derecha)</text>
<text x="46" y="252" font-size="11" font-weight="700" fill="#5F5E5A" text-anchor="start" letter-spacing="1">Respuestas</text>
<rect x="46" y="262" width="40" height="20" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="66" y="276.5" font-size="11.5" font-weight="700" fill="#27500A" text-anchor="middle" >201</text>
<text x="96" y="276.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" >DocumentResponse (creado)</text>
<rect x="46" y="286" width="40" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="66" y="300.5" font-size="11.5" font-weight="700" fill="#712B13" text-anchor="middle" >401</text>
<text x="96" y="300.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" >API Key inválida o ausente</text>
<rect x="46" y="310" width="40" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="66" y="324.5" font-size="11.5" font-weight="700" fill="#712B13" text-anchor="middle" >413</text>
<text x="96" y="324.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" >Petición demasiado grande (&gt; 3 MB)</text>
<rect x="340" y="262" width="40" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="360" y="276.5" font-size="11.5" font-weight="700" fill="#712B13" text-anchor="middle" >422</text>
<text x="390" y="276.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" >Error de validación del cuerpo</text>
<rect x="30" y="362" width="600" height="190" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.2"/>
<rect x="46" y="376" width="58" height="24" rx="5" fill="#378ADD" stroke="#378ADD" stroke-width="1.2"/>
<text x="75" y="393" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >GET</text>
<text x="112" y="393" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start" >/documents/{documentNumber}</text>
<text x="614" y="393" font-size="11.5" font-weight="600" fill="#0C447C" text-anchor="end" >requiere X-API-KEY</text>
<text x="46" y="420" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" >Consulta un documento propio y devuelve una URL prefirmada renovada (1 h).</text>
<text x="46" y="444" font-size="11" font-weight="700" fill="#5F5E5A" text-anchor="start" letter-spacing="1">Path</text>
<text x="46" y="462" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start" font-family="Consolas,Menlo,monospace">documentNumber: string, p. ej. ALF-000001</text>
<text x="46" y="486" font-size="11" font-weight="700" fill="#5F5E5A" text-anchor="start" letter-spacing="1">Respuestas</text>
<rect x="46" y="496" width="40" height="20" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="66" y="510.5" font-size="11.5" font-weight="700" fill="#27500A" text-anchor="middle" >200</text>
<text x="96" y="510.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" >DocumentResponse</text>
<rect x="46" y="520" width="40" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="66" y="534.5" font-size="11.5" font-weight="700" fill="#712B13" text-anchor="middle" >401</text>
<text x="96" y="534.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" >API Key inválida o ausente</text>
<rect x="340" y="496" width="40" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="360" y="510.5" font-size="11.5" font-weight="700" fill="#712B13" text-anchor="middle" >404</text>
<text x="390" y="510.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" >No existe o pertenece a otro proyecto</text>
<rect x="30" y="572" width="600" height="120" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<rect x="46" y="586" width="58" height="24" rx="5" fill="#378ADD" stroke="#378ADD" stroke-width="1.2"/>
<text x="75" y="603" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >GET</text>
<text x="112" y="603" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start" >/health</text>
<text x="614" y="603" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="end" >público</text>
<text x="46" y="630" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" >Verifica que el servicio responde.</text>
<rect x="46" y="646" width="40" height="20" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="66" y="660.5" font-size="11.5" font-weight="700" fill="#27500A" text-anchor="middle" >200</text>
<text x="96" y="660.5" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" ></text>
<text x="106" y="660" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start" font-family="Consolas,Menlo,monospace">{ "status": "ok", "bucket": "receipts" }</text>
<rect x="660" y="80" width="310" height="188" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="676" y="104" font-size="14" font-weight="700" fill="#0C447C" text-anchor="start" >DocumentRequest</text>
<text x="676" y="132" font-size="12.5" font-weight="600" fill="#0C447C" text-anchor="start" font-family="Consolas,Menlo,monospace">externalReference</text>
<text x="676" y="149" font-size="11.5" font-weight="400" fill="#0C447C" text-anchor="start" >string · 1–100 · requerido</text>
<text x="676" y="176" font-size="12.5" font-weight="600" fill="#0C447C" text-anchor="start" font-family="Consolas,Menlo,monospace">html</text>
<text x="676" y="193" font-size="11.5" font-weight="400" fill="#0C447C" text-anchor="start" >string · 1–2 000 000 · requerido</text>
<text x="676" y="220" font-size="12.5" font-weight="600" fill="#0C447C" text-anchor="start" font-family="Consolas,Menlo,monospace">metadata</text>
<text x="676" y="237" font-size="11.5" font-weight="400" fill="#0C447C" text-anchor="start" >object · opcional (por defecto {})</text>
<text x="676" y="258" font-size="10.5" font-weight="400" fill="#0C447C" text-anchor="start" >Acepta camelCase y snake_case</text>
<rect x="660" y="288" width="310" height="160" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="676" y="312" font-size="14" font-weight="700" fill="#27500A" text-anchor="start" >DocumentResponse</text>
<text x="676" y="338" font-size="12.5" font-weight="600" fill="#27500A" text-anchor="start" font-family="Consolas,Menlo,monospace">documentNumber</text>
<text x="676" y="354" font-size="11.5" font-weight="400" fill="#27500A" text-anchor="start" >string · p. ej. ALF-000001</text>
<text x="676" y="376" font-size="12.5" font-weight="600" fill="#27500A" text-anchor="start" font-family="Consolas,Menlo,monospace">externalReference</text>
<text x="676" y="392" font-size="11.5" font-weight="400" fill="#27500A" text-anchor="start" >string · el enviado por el cliente</text>
<text x="676" y="414" font-size="12.5" font-weight="600" fill="#27500A" text-anchor="start" font-family="Consolas,Menlo,monospace">pdfUrl</text>
<text x="676" y="430" font-size="11.5" font-weight="400" fill="#27500A" text-anchor="start" >string · URL prefirmada (1 hora)</text>
<rect x="660" y="468" width="310" height="224" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="676" y="492" font-size="14" font-weight="700" fill="#633806" text-anchor="start" >Reglas del servicio</text>
<text x="676" y="518" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >Cada API Key pertenece a un proyecto.</text>
<text x="676" y="539" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >La numeración es independiente por</text>
<text x="676" y="560" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >proyecto: PREFIJO-000001, 000002…</text>
<text x="676" y="581" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >El HTML puede incluir {{documentNumber}}</text>
<text x="676" y="602" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >y se reemplaza por el número asignado.</text>
<text x="676" y="623" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >Assets externos: solo hosts permitidos</text>
<text x="676" y="644" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >(ALLOWED_ASSET_HOSTS) o data: URIs.</text>
<text x="676" y="665" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >Un proyecto no ve documentos de otro.</text>
<text x="30" y="724" font-size="11" font-weight="700" fill="#5F5E5A" text-anchor="start" letter-spacing="1">Ejemplo</text>
<rect x="30" y="734" width="940" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<text x="46" y="759" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" font-family="Consolas,Menlo,monospace">curl -X POST http://localhost:8000/documents -H "X-API-KEY: rk_…" -H "Content-Type: application/json" -d @recibo.json</text>
</svg>
