<text x="782" y="522" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">reemplaza {{documentNumber}}</text>
<text x="782" y="538" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">SafeURLFetcher valida assets</text>
<line x1="790" y1="574" x2="286" y2="574" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
