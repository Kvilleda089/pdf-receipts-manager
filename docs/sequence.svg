<text x="126" y="773" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">pdfUrl = URL prefirmada válida 1 hora</text>
<rect x="30" y="800" width="1040" height="0.1" rx="8" fill="none" stroke="none" stroke-width="1.2"/>
<rect x="30" y="800" width="1040" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="46" y="819" font-size="12" font-weight="700" fill="#633806" text-anchor="start" >Errores posibles:</text>
<text x="172" y="819" font-size="12" font-weight="400" fill="#633806" text-anchor="start" >401 API Key inválida o ausente  ·  413 cuerpo &gt; 3 MB  ·  422 datos inválidos  ·  500 fallo al renderizar o subir a S3</text>
<text x="46" y="836" font-size="11" font-weight="400" fill="#633806" text-anchor="start" >El número se reserva antes de renderizar; si falla el renderizado o la subida, la transacción no se confirma y no se guarda el documento.</text>
