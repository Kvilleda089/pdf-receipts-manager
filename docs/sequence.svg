<line x1="280" y1="482" x2="784" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="535.0" y="475" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">render_pdf(html, número)</text>
