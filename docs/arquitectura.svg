<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Arquitectura - PDF Receipts Manager</title>
<desc>Proyectos consumidores llaman por HTTPS a una API FastAPI que genera PDFs con WeasyPrint, los guarda en S3 y registra metadatos en PostgreSQL.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="30" y="38" font-size="20" font-weight="700" fill="#2C2C2A" text-anchor="start" >PDF Receipts Manager · Arquitectura</text>
<text x="30" y="58" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start" >Servicio central que convierte HTML en PDF numerado, lo almacena y lo expone por URL prefirmada</text>
<text x="30" y="100" font-size="11" font-weight="600" fill="#5F5E5A" text-anchor="start" letter-spacing="1">PROYECTOS CONSUMIDORES</text>
